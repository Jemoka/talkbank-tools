---
# Top-level playbook for batchalign3 server install.
#
# Usage:
#   make deploy HOST=batchalign.lab.example
# or directly:
#   ansible-playbook -i "<host>," deploy/ansible/site.yml \
#     -e batchalign_version=ed7afec
#
# Roles invoked here are kept idempotent so re-runs are safe. The role
# installs:
#   - uv (Astral Python manager) — single trusted binary,
#   - the batchalign3 release tarball matching `batchalign_version` (or
#     a git ref if `batchalign_version=HEAD`),
#   - a systemd unit `batchalign3.service` that runs `batchalign3 daemon`,
#   - a writable working directory under `/var/lib/batchalign3`,
#   - an optional `media_paths_root` for paths-mode jobs.
#
# Out of scope: TLS termination (front this with nginx/Caddy), persistent
# job storage migration (SQLite JobRegistry, Landing 5), and remote model
# pre-warming.

- name: Install and configure batchalign3 daemon
  hosts: all
  become: true
  gather_facts: true
  roles:
    - batchalign
