name: bazel · rust

# Build + test every Rust crate via Bazel. Scoped to changes that
# actually affect Rust output (Cargo.toml, .rs, BUILD.bazel files
# under the Rust tiers, plus shared infra).

on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "MODULE.bazel"
      - "MODULE.bazel.lock"
      - ".bazelrc"
      - ".bazelversion"
      - ".github/workflows/bazel-rust.yml"
  pull_request:
    paths:
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "MODULE.bazel"
      - "MODULE.bazel.lock"
      - ".bazelrc"
      - ".bazelversion"
      - ".github/workflows/bazel-rust.yml"

concurrency:
  group: bazel-rust-${{ github.ref }}
  cancel-in-progress: true

env:
  BAZELISK_SKIP_WRAPPER: true

jobs:
  build-and-test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14]
    steps:
      - uses: actions/checkout@v4

      - uses: bazel-contrib/setup-bazel@0.15.0
        with:
          bazelisk-cache: true
          disk-cache: ${{ github.workflow }}
          repository-cache: true
          cache-version: 2-${{ runner.os }}-${{ runner.arch }}

      - name: bazel build (Rust tiers)
        run: |
          bazel build --config=ci \
            //crates/batchalign/...

      - name: bazel test (Rust unit tests)
        run: |
          bazel test --config=ci \
            //crates/batchalign/... \
            //crates/batchalign/batchalign-engine:batchalign_engine_unit_test \
            //crates/batchalign/batchalign-engine:cache_smoke \
            //crates/batchalign/batchalign-engine:pipeline_smoke
