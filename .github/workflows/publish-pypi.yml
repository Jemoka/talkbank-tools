name: publish · pypi (batchalign3)

# Builds the batchalign3 wheel via Bazel + maturin, then uploads to PyPI
# via the trusted-publisher action. Build half is bazelified; PyPI
# upload is workflow-only (needs OIDC permissions).
#
# Dry-run: leave `publish` unchecked → builds wheels for every supported
# platform and uploads them as workflow artifacts only.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Wheel version (e.g. 0.1.5)"
        required: true
        type: string
      publish:
        description: "Upload to PyPI? (false → artifact only)"
        type: boolean
        default: false

concurrency:
  group: publish-pypi-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # macOS-14 = arm64 · macOS-13 = intel · ubuntu = manylinux glibc
        os: [ubuntu-latest, macos-13, macos-14]
    steps:
      - uses: actions/checkout@v4
      - uses: bazel-contrib/setup-bazel@0.15.0
        with: { bazelisk-cache: true, disk-cache: publish-pypi }
      - uses: astral-sh/setup-uv@v3
      - name: Build wheel (bazel → maturin)
        env:
          MATURIN_PROFILE: release
        run: bazel run //python/batchalign:wheel
      - uses: actions/upload-artifact@v4
        with:
          name: batchalign3-wheel-${{ matrix.os }}
          path: python/target/wheels/*.whl

  publish:
    if: ${{ inputs.publish }}
    runs-on: ubuntu-latest
    needs: [build]
    environment: pypi
    permissions:
      id-token: write  # PyPI trusted-publisher (OIDC)
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: batchalign3-wheel-*
          path: dist/
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@release/v1
