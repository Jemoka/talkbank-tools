name: publish · pypi (batchalign)

# Multi-platform wheel matrix + trusted-publisher upload to PyPI.
#
# Each matrix cell runs on a native runner for its target, so every wheel
# is a host build (no cross-compile). The wheel is `cp310-abi3-<plat>`,
# meaning a single artifact per platform installs on any CPython >= 3.10.
#
# Per-cell flow:
#   setup-bazel → `bazel run //python/batchalign:wheel` → upload artifact.
#
# `bazel run //python/batchalign:wheel` is one target end-to-end:
# the genrule produces the wheel + tag in bazel-bin, the sh_binary
# copies it under the tagged name into python/target/wheels/. CI does
# not script the copy.
#
# Everything else (uv, maturin, rust, clang) is pulled hermetically by
# Bazel from MODULE.bazel / multitool.lock.json / pyproject.toml's
# [tool.batchalign.pinned_tools]. We do not pre-install rust/uv/etc on
# the runner; the hermeticity guard inside the sh_binary asserts pins.
#
# (One residual leak: maturin's cargo discovery still uses `cargo` from
# PATH inside the Bazel sandbox. On GitHub-hosted runners, `cargo`
# comes pre-installed via the rustup toolchain shim. Plugging this is
# a separate refactor — `bazel/python/maturin_build.sh` would need to
# pass `CARGO=$(rootpath @rust_toolchains//:cargo_alias)` so the
# bazel-managed cargo is used instead of host.)
#
# manylinux retagging happens via auditwheel inside the Linux cells
# (maturin invokes it when MATURIN_USE_AUDITWHEEL is set).
#
# Dry-run: leave `publish` unchecked → builds for every supported platform
# and uploads as workflow artifacts only.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Wheel version (must match python/pyproject.toml [project].version)"
        required: true
        type: string
      publish:
        description: "Upload to PyPI? (false → artifact only)"
        type: boolean
        default: false

concurrency:
  group: publish-pypi-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assert pyproject.toml version matches input tag
        run: |
          pyver=$(awk -F'"' '/^version *= *"/ {print $2; exit}' python/pyproject.toml)
          if [[ "$pyver" != "${{ inputs.tag }}" ]]; then
            echo "::error::pyproject.toml version ($pyver) does not match input tag (${{ inputs.tag }})"
            echo "  fix: bump python/pyproject.toml [project].version before re-dispatching"
            exit 1
          fi

  build:
    needs: [verify-version]
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Every cell is a NATIVE build -- runner arch == target arch.
          # No MATURIN_TARGET, no cross-compile sysroot. Maturin tags the
          # wheel with the runner's platform automatically.
          - { runner: macos-14,         platform: macos-arm64 }
          - { runner: macos-15-intel,   platform: macos-x86_64 }
          - { runner: ubuntu-latest,    platform: linux-x86_64 }
          - { runner: ubuntu-24.04-arm, platform: linux-aarch64 }
          - { runner: windows-latest,   platform: windows-x86_64 }
    steps:
      - uses: actions/checkout@v4

      - uses: bazel-contrib/setup-bazel@0.15.0
        with:
          bazelisk-cache: true
          disk-cache: publish-pypi-${{ matrix.platform }}
          repository-cache: true
          cache-version: 2-${{ matrix.platform }}

      - name: Build wheel for ${{ matrix.platform }}
        shell: bash
        env:
          # `MATURIN_USE_AUDITWHEEL=1` triggers manylinux retagging on Linux;
          # no-op on macOS/Windows. Linux cells produce manylinux_2_28-tagged
          # wheels that work across modern glibc distributions.
          MATURIN_USE_AUDITWHEEL: ${{ startsWith(matrix.runner, 'ubuntu') && '1' || '' }}
        run: bazel run -c opt //python/batchalign:wheel

      - uses: actions/upload-artifact@v4
        with:
          name: batchalign-wheel-${{ matrix.platform }}
          path: python/target/wheels/*.whl
          if-no-files-found: error

  publish:
    if: ${{ inputs.publish }}
    runs-on: ubuntu-latest
    needs: [build]
    environment: pypi
    permissions:
      # Required for the trusted-publisher OIDC flow (configure on PyPI
      # side at https://pypi.org/manage/project/batchalign/settings/publishing/).
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: batchalign-wheel-*
          path: dist/
          merge-multiple: true
      - name: List artifacts to upload
        run: ls -lh dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true  # idempotent re-runs at the same version
