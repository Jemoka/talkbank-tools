name: bazel · build-all (nightly)

# Slow, exhaustive build across every Bazel target. Runs on a cron
# rather than on every push so PR latency stays sane. Also runnable
# on-demand via workflow_dispatch.

on:
  schedule:
    - cron: "0 6 * * *"  # 06:00 UTC daily
  workflow_dispatch: {}

jobs:
  build-all:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14]
    steps:
      - uses: actions/checkout@v4
      - uses: bazel-contrib/setup-bazel@0.15.0
        with:
          bazelisk-cache: true
          disk-cache: ${{ github.workflow }}
          repository-cache: true
      - name: Install re2c
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then sudo apt-get update && sudo apt-get install -y re2c
          elif [ "$RUNNER_OS" = "macOS" ]; then brew install re2c; fi
      - uses: astral-sh/setup-uv@v3
      - name: bazel build //...
        run: bazel build --config=ci //...
      - name: bazel test //...
        run: bazel test --config=ci //...
