name: bazel · build-all (nightly)

# Slow, exhaustive build across every Bazel target. Runs on a cron
# rather than on every push so PR latency stays sane. Also runnable
# on-demand via workflow_dispatch.

on:
  schedule:
    - cron: "0 6 * * *"  # 06:00 UTC daily
  workflow_dispatch: {}

env:
  BAZELISK_SKIP_WRAPPER: true

jobs:
  build-all:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14]
    steps:
      - uses: actions/checkout@v4
      - uses: bazel-contrib/setup-bazel@0.19.0
        with:
          bazelisk-cache: true
          disk-cache: ${{ github.workflow }}
          repository-cache: true
          cache-version: 2-${{ runner.os }}-${{ runner.arch }}
      - uses: astral-sh/setup-uv@v3
      - name: bazel build //...
        run: bazel build --config=ci //...
      - name: bazel test //...
        run: bazel test --config=ci //...
