name: bazel · wheels (PR matrix)

# Multi-platform wheel verification on every PR + main push. Produces
# the same set of wheels as `publish-pypi.yml` but doesn't upload them
# anywhere — artifacts are downloadable from the workflow run for ~30
# days for manual inspection. Catches per-platform regressions before
# they reach the publish path.

on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - "python/**"
      - "crates/batchalign/**"
      - "bazel/python/**"
      - "MODULE.bazel"
      - ".bazelignore"
      - ".bazelrc"
      - "MODULE.bazel.lock"
      - "multitool.lock.json"
      - "rust-toolchain.toml"
      - ".github/workflows/bazel-wheels.yml"
  pull_request:
    paths:
      - "python/**"
      - "crates/batchalign/**"
      - "bazel/python/**"
      - "MODULE.bazel"
      - ".bazelignore"
      - ".bazelrc"
      - "MODULE.bazel.lock"
      - "multitool.lock.json"
      - "rust-toolchain.toml"
      - ".github/workflows/bazel-wheels.yml"

concurrency:
  group: bazel-wheels-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Every cell is a NATIVE build. No MATURIN_TARGET; runner arch ==
          # target arch.
          - { runner: macos-14,         platform: macos-arm64 }
          - { runner: macos-15-intel,   platform: macos-x86_64 }
          - { runner: ubuntu-latest,    platform: linux-x86_64 }
          - { runner: ubuntu-24.04-arm, platform: linux-aarch64 }
          - { runner: windows-latest,   platform: windows-x86_64 }
    steps:
      - uses: actions/checkout@v4

      - uses: bazel-contrib/setup-bazel@0.19.0
        with:
          bazelisk-cache: true
          disk-cache: bazel-wheels-${{ matrix.platform }}
          repository-cache: true
          cache-version: 2-${{ matrix.platform }}

      - name: Enable long git paths on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          git config --system core.longpaths true
          Set-ItemProperty -Path 'HKLM:\SYSTEM\CurrentControlSet\Control\FileSystem' -Name LongPathsEnabled -Value 1

      - name: Build wheel for ${{ matrix.platform }}
        shell: bash
        env:
          # CI verifies committed locks. The local mtime-reactivity wrapper
          # treats fresh checkout timestamps as stale and needlessly repins.
          BAZELISK_SKIP_WRAPPER: true
          CARGO_NET_GIT_FETCH_WITH_CLI: ${{ runner.os == 'Windows' && 'true' || 'false' }}
          MATURIN_USE_AUDITWHEEL: ${{ startsWith(matrix.runner, 'ubuntu') && '1' || '' }}
        run: bazel run -c opt //python/batchalign:wheel

      # The wheel itself is `cp310-abi3`, so verify the minimum supported
      # interpreter on every native platform. `setup-python` is the only
      # host tool installed here; the BUILD path above is Bazel-driven.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Smoke test wheel installs + imports on Python 3.10
        shell: bash
        run: |
          set -e
          WHEEL=$(ls python/target/wheels/batchalign-*.whl | head -1)
          echo "wheel: $WHEEL"
          # Filename sanity check — must be cp310-abi3, no cp312-cp312.
          if [[ "$WHEEL" != *"cp310-abi3"* ]]; then
            echo "::error::wheel tag is not cp310-abi3 — abi3 setup broke"
            exit 1
          fi
          python -m pip install --quiet --force-reinstall "$WHEEL"
          python <<'PY'
          import sys, batchalign
          from batchalign import _core
          print(f"python           {sys.version.split()[0]}")
          print(f"batchalign       {batchalign.__file__}")
          print(f"batchalign._core {_core.__file__}")
          PY
          batchalign --help > /dev/null

      - uses: actions/upload-artifact@v4
        with:
          name: batchalign-wheel-${{ matrix.platform }}
          path: python/target/wheels/*.whl
          if-no-files-found: error
          retention-days: 30
