name: bazel · typescript

# VS Code extension is the only TypeScript surface still in the repo.
# The Batchalign React dashboard (`apps/batchalign/batchalign-cli-webdashboard`)
# was retired — the live Batchalign UI lives in the Tauri shell under
# `apps/batchalign/dashboard-desktop/` and builds via `cargo tauri build`
# (not modelled here).

on:
  push:
    branches: [main]
    paths:
      - "apps/vscode-extension/**"
      - "schemas/**"
      - ".github/workflows/bazel-typescript.yml"
  pull_request:
    paths:
      - "apps/vscode-extension/**"
      - "schemas/**"
      - ".github/workflows/bazel-typescript.yml"

concurrency:
  group: bazel-ts-${{ github.ref }}
  cancel-in-progress: true

jobs:
  vscode-extension:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: bazel-contrib/setup-bazel@0.15.0
        with:
          bazelisk-cache: true
          disk-cache: ${{ github.workflow }}-vscode
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - name: Build extension
        run: bazel run //apps/vscode-extension:build
      - name: Run extension tests
        run: bazel run //apps/vscode-extension:test
      - name: Package .vsix (artifact only)
        run: bazel run //apps/vscode-extension:package
      - uses: actions/upload-artifact@v4
        with:
          name: vscode-extension-vsix
          path: apps/vscode-extension/*.vsix
