name: bazel · typescript

# VS Code extension + React dashboard. Wraps npm/vite/vsce — there's
# no first-class Bazel modelling of those tools.

on:
  push:
    branches: [main]
    paths:
      - "apps/vscode-extension/**"
      - "apps/batchalign/batchalign-cli-webdashboard/**"
      - "schemas/**"
      - ".github/workflows/bazel-typescript.yml"
  pull_request:
    paths:
      - "apps/vscode-extension/**"
      - "apps/batchalign/batchalign-cli-webdashboard/**"
      - "schemas/**"
      - ".github/workflows/bazel-typescript.yml"

concurrency:
  group: bazel-ts-${{ github.ref }}
  cancel-in-progress: true

jobs:
  vscode-extension:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: bazel-contrib/setup-bazel@0.15.0
        with:
          bazelisk-cache: true
          disk-cache: ${{ github.workflow }}-vscode
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - name: Build extension
        run: bazel run //apps/vscode-extension:build
      - name: Run extension tests
        run: bazel run //apps/vscode-extension:test
      - name: Package .vsix (artifact only on PRs)
        run: bazel run //apps/vscode-extension:package
      - uses: actions/upload-artifact@v4
        with:
          name: vscode-extension-vsix
          path: apps/vscode-extension/*.vsix

  dashboard-spa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: bazel-contrib/setup-bazel@0.15.0
        with:
          bazelisk-cache: true
          disk-cache: ${{ github.workflow }}-dashboard
      - name: Build dashboard SPA (vite, hermetic)
        # `:dist` is the Vite TreeArtifact emitted by vite_bin.vite into
        # bazel-out/. No shell wrapper, no `npm install` at build time —
        # node_modules comes from rules_js + npm_link_all_packages, and
        # the host's Node toolchain is irrelevant.
        run: bazel build //apps/batchalign/batchalign-cli-webdashboard:dist
      - name: Upload dashboard dist
        uses: actions/upload-artifact@v4
        with:
          name: batchalign-dashboard-dist
          # The TreeArtifact lives under bazel-bin (which is a symlink
          # to bazel-out/<cfg>/bin). Convention.txt would be `bazel cquery
          # --output=files`, but for a known-good label the symlinked
          # path is stable.
          path: bazel-bin/apps/batchalign/batchalign-cli-webdashboard/dist
