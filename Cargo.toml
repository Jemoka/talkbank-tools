[workspace]
resolver = "2"
members = [
    # Core (parser / model / transform / shared utilities)
    "crates/core/talkbank-model",
    "crates/core/talkbank-derive",
    "crates/core/talkbank-parser",
    "crates/core/talkbank-transform",
    "crates/core/talkbank-parser-re2c",
    "crates/core/talkbank-parser-tests",
    "crates/utils",
    # CHAT spec generators (static codegen + live-parser verification)
    "crates/spec/talkbank-spec-testgen",
    "crates/spec/talkbank-spec-testrun",
    # Chatter (CLI + LSP, both produce `chatter`-branded binaries)
    "crates/chatter/chatter-cli",
    "crates/chatter/chatter-lsp",
    # CLAN (analysis library + FFI to the legacy CLAN app)
    "crates/clan/clan-core",
    "crates/clan/send2clan-sys",
    # Batchalign (runtime / shared types / Python FFI bridge)
    "crates/batchalign/batchalign-cli",
    "crates/batchalign/batchalign-types",
    "crates/batchalign/batchalign-pyo3",
    # Workspace dev tooling
    "crates/xtask",
    # Tauri desktop shells (tiered by product)
    "apps/chatter/chatter-gui/src-tauri",
    "apps/batchalign/batchalign-gui-dashboard/src-tauri",
]
exclude = [
    "fuzz",  # cargo-fuzz uses its own nightly toolchain with sanitizer flags
]

[workspace.package]
version = "0.2.0"
edition = "2024"
authors = ["Franklin Chen <franklinchen@franklinchen.com>"]
license = "BSD-3-Clause"
repository = "https://github.com/TalkBank/talkbank-tools"
homepage = "https://talkbank.org/"
keywords = ["talkbank", "chat-format", "linguistics", "nlp", "parsing"]
categories = ["parser-implementations", "text-processing"]
rust-version = "1.89.0"

# Workspace-level lint policy.
#
# Panic-as-control-flow is the dominant footgun in long-lived Rust code
# (LSP, server, async workers). The CLAUDE.md standard is "no panics in
# long-lived logic, recoverable conditions go through Result with thiserror
# domain types." These warn-level lints make every new panic site visible
# without one-shot breaking the existing tree (see
# `book/src/operations/panic-audit/baseline.md` for the frozen baseline;
# per-crate `[lints]` promote to `deny` as each crate finishes its audit).
#
# Test code keeps panic discipline relaxed — assertion macros panic by
# design, and `unwrap()` on a fixture that's known to parse is the standard
# Rust testing idiom. Per-test-module `#[allow]` is preferred over blanket
# exemptions; doctests remain unrestricted.
[workspace.lints.clippy]
unwrap_used   = "warn"
expect_used   = "warn"
panic         = "warn"
todo          = "warn"
unimplemented = "warn"

# NOTE: No `[workspace.dependencies]` section. By design — every crate
# declares its own dependencies inline (version + features) and uses
# explicit relative path deps for intra-workspace links. See
# `CONTRIBUTING.md` for the rationale.

[profile.dev]
split-debuginfo = "unpacked"
debug = "line-tables-only"          # Less debug info → faster linking

[profile.dev.build-override]
opt-level = 3                       # Optimize proc macros and build scripts

[profile.release]
# Deliberately lean. Batchalign3's wall-clock is dominated by Python ML
# inference (Stanza, Whisper) and external HTTP (Rev.AI), not by Rust
# code paths. LTO + codegen-units = 1 was previously set but the
# build-time cost (5–15 min link, single-threaded codegen on the
# largest crates) was disproportionate to a runtime gain that is
# empirically lost in the noise of a single Stanza inference call.
# strip was enabled for binary-size reasons that don't matter on the
# fleet machines. Default release uses opt-level 3 with codegen
# parallelism intact and symbols kept.

[profile.test]
split-debuginfo = "unpacked"
debug = "line-tables-only"
