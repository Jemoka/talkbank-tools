[package]
name = "batchalign-engine"
version = "0.3.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Tokio runtime, per-backend batching, SQLite cache, and PyO3 Pipeline for batchalign (spec2.md §11–§13)."
publish = false

[lib]
name = "_core"
# `cdylib` is what maturin packages into the Python wheel as `batchalign._core`.
# `rlib` keeps in-tree Rust integration tests usable.
crate-type = ["cdylib", "rlib"]

[features]
default = []
# Forwarded to PyO3 by maturin during wheel build. Plain `cargo build` leaves
# it off so tests can link without the Python embed/extension shim toggle.
extension-module = ["pyo3/extension-module"]

[dependencies]
batchalign-core = { path = "../batchalign-core", version = "0.3.0", features = ["python"] }
talkbank-model = { git = "https://github.com/talkbank/chatter", rev = "fd919fb9769d4ee001282d26caac49c6bd0bfde6", version = "0.16.0" }
talkbank-parser = { git = "https://github.com/talkbank/chatter", rev = "fd919fb9769d4ee001282d26caac49c6bd0bfde6", version = "0.16.0" }

tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
# Cache backend: LMDB via `heed` (vendored C; cargo + bazel build it
# automatically through cc-rs). Chosen over redb because redb is
# single-writer-per-process — the workspace's CLI, TUI, and dashboard
# all want to share one cache directory and redb errored on the second
# open. LMDB allows multiple processes to read concurrently (MVCC) and
# serializes writers via its lock file, so concurrent invocations Just
# Work without coordination. See `src/cache.rs` for the full story.
heed = "0.22"
dirs = "5"
num_cpus = "1"
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
async-trait = "0.1"
futures = "0.3"
blake3 = "1"
smol_str = { version = "0.3", features = ["serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

# `abi3` + `abi3-py310` produces a wheel that uses Python's stable C API
# only, so a single compiled `_core.so` runs on CPython 3.10, 3.11, 3.12,
# 3.13 (and forward). Maturin auto-tags the resulting wheel as
# `cp310-abi3-<platform>` which pip on any 3.10+ interpreter accepts.
# The build-time interpreter pin (MODULE.bazel python.toolchain,
# pyproject's [tool.batchalign.pinned_tools].python) stays at 3.12 --
# abi3 only constrains the runtime floor, not the build machine.
pyo3 = { version = "0.28", features = ["macros", "abi3", "abi3-py310"] }

[build-dependencies]
# Used by `build.rs` to walk the proto-schema inventory and emit
# `_proto_generated.py` into the Python source tree before maturin
# packages the wheel. Mirrors the runtime path of `batchalign-core` so
# the schema build script sees every `register_proto_schema!` registration.
batchalign-core = { path = "../batchalign-core" }
inventory = "0.3"
serde_json = "1"

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
