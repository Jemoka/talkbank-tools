[package]
name = "batchalign-core"
version = "0.3.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Types, traits, and AST↔backend adapters for the batchalign rewrite (spec2.md)."
publish = false

[lib]
name = "batchalign_core"
path = "src/lib.rs"

[features]
# Re-export PyO3 #[pyclass] bindings. Enabled by `batchalign-engine`, which is
# the maturin-built cdylib. Pure-Rust unit tests don't need this.
python = ["dep:pyo3"]

[dependencies]
talkbank-model = { path = "../../core/talkbank-model", version = "0.2.0" }
talkbank-parser = { path = "../../core/talkbank-parser", version = "0.2.0" }
talkbank-transform = { path = "../../core/talkbank-transform", version = "0.2.0" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = { version = "1", features = [] }
thiserror = "2"
anyhow = "1"
async-trait = "0.1"
futures = "0.3"
smol_str = { version = "0.3", features = ["serde"] }
blake3 = "1"
tracing = "0.1"
symphonia = { version = "0.5", features = ["all"] }

pyo3 = { version = "0.28", optional = true, default-features = false, features = ["macros"] }

[dev-dependencies]
# Runner tests use #[tokio::test] for the async TaskRunner trait.
tokio = { version = "1", features = ["rt", "macros"] }

[lints]
workspace = true
