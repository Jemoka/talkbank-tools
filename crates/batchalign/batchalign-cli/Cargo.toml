[package]
name = "batchalign-cli"
version = "0.1.0"
description = "batchalign3: command-line interface, application, server, worker pool, cache"
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

# Keep the library name stable as `batchalign` so that internal tests and
# downstream callers continue to write `use batchalign::...`. The package
# rename (batchalign → batchalign-cli) is a Cargo-level concern only.
[lib]
name = "batchalign"
path = "src/lib.rs"

[features]
default = ["server", "binary-entry", "embed-dashboard"]

# Binary entrypoint: tracing-OTLP exporter and pre-main initialization
# for the `batchalign3` CLI binary. The library does not require this.
binary-entry = [
    "dep:opentelemetry",
    "dep:opentelemetry_sdk",
    "dep:opentelemetry-otlp",
    "dep:tracing-opentelemetry",
]

# HTTP server, Temporal backend, SQLite job persistence, OpenAPI schema.
# Disable this feature for direct-mode-only builds that do not need axum,
# temporal, or the route/DB layer.
server = [
    "dep:anyhow",
    "dep:axum",
    "dep:tower-http",
    "dep:utoipa",
    "dep:temporalio-client",
    "dep:temporalio-common",
    "dep:temporalio-macros",
    "dep:temporalio-sdk",
    "dep:temporalio-sdk-core",
]

# Embed the React dashboard (apps/batchalign/cli-web-statuspage/dist/) into the binary at compile time.
# Requires `bazel build //...-dashboard` first. Without this feature, the dashboard is
# served from $BATCHALIGN_DASHBOARD_DIR or ~/.batchalign3/dashboard/ only.
embed-dashboard = ["dep:include_dir"]

[[bin]]
# The artifact name `batchalign3` is load-bearing: fleet deploys
# (`deploy/scripts/deploy_batchalign3.sh`) pick up
# `target/release/batchalign3`. Do NOT rename.
name = "batchalign3"
path = "src/bin/batchalign3.rs"
required-features = ["binary-entry"]

[dependencies]
# ── Always required (engine + direct mode) ────────────────────────────
batchalign-types = { path = "../batchalign-types", version = "0.2.0" }
# chat_ops module deps (formerly batchalign-chat-ops, folded 2026-04-30)
aho-corasick = "1.1"
smallvec = { version = "1.15", features = ["serde", "union", "const_generics"] }
strsim = "0.11.1"
whatlang = "0.18"
zhconv = "0.4.1"
rustc-hash = "2.1"
talkbank-model = { path = "../../core/talkbank-model", version = "0.2.0" }
talkbank-parser = { path = "../../core/talkbank-parser", version = "0.2.0" }
talkbank-transform = { path = "../../core/talkbank-transform", version = "0.2.0" }
tokio = { version = "1.52", features = ["full"] }
futures = "0.3"
futures-util = "0.3"
libc = "0.2"
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite", "migrate"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tracing-appender = "0.2"
thiserror = "^2.0.18"
uuid = { version = "1", features = ["v4", "serde"] }
dashmap = "6.1"
dirs = "6.0"
walkdir = "^2.5"
sysinfo = "0.39"
serde = { version = "1.0", features = ["derive", "rc"] }
serde_json = "1.0"
serde_yaml = "0.9"
schemars = { version = "1.2", features = ["indexmap2", "smol_str03"] }
toml = "^1.1.2"
tokio-util = "0.7"
tokio-stream = { version = "0.1", features = ["sync"] }
chrono = "0.4"
async-trait = "0.1"
blake3 = "1.8"
moka = { version = "0.12", features = ["future"] }
fs2 = "0.4"
tempfile = "3"

# ── CLI surface (formerly batchalign-cli) ────────────────────────────
clap = { version = "4.6", features = ["derive", "env"] }
csv = "1"
indicatif = "0.18"
rand = "0.10"
zip = { version = "8", default-features = false, features = ["deflate"] }
ratatui = { version = "0.30", features = ["serde"] }
crossterm = "0.29"

# ── Staged remote execution (rsync orchestrator polls via HTTP) ──────
reqwest = { version = "0.13", features = ["multipart", "json", "blocking"] }

# ── Binary entry (optional, behind "binary-entry") ───────────────────
tracing-opentelemetry = { version = "0.32", optional = true }
opentelemetry = { version = "0.31", optional = true, features = ["trace"] }
opentelemetry_sdk = { version = "0.31", optional = true, features = ["trace", "rt-tokio"] }
opentelemetry-otlp = { version = "0.31", default-features = false, optional = true, features = ["trace", "http-proto", "reqwest-client"] }

# ── Server-only (optional, behind "server" feature) ──────────────────
# anyhow is required by the temporalio v0.4 `#[workflow_methods]` macro
# expansion and by `ApplicationFailure::non_retryable(anyhow!(...))` at
# the temporal-activity error sites in `temporal_backend.rs`. Gated
# under `server` because it is only reachable when temporalio deps are.
anyhow = { version = "1.0", optional = true }
axum = { version = "0.8", optional = true, features = ["ws"] }
tower-http = { version = "0.6", optional = true, features = ["cors", "fs", "limit", "trace", "compression-gzip", "compression-br", "catch-panic", "timeout"] }
utoipa = { version = "5", optional = true, features = ["axum_extras", "chrono", "uuid"] }
temporalio-client = { version = "0.4", optional = true }
temporalio-common = { version = "0.4", optional = true }
temporalio-macros = { version = "0.4", optional = true }
temporalio-sdk = { version = "0.4", optional = true }
temporalio-sdk-core = { version = "0.4", optional = true }

# ── Embed dashboard (optional) ───────────────────────────────────────
include_dir = { version = "0.7", optional = true }

[dev-dependencies]
tokio = { version = "1.52", features = ["full", "test-util"] }
reqwest = { version = "0.13", features = ["multipart", "json", "blocking"] }
insta = { version = "1.47", features = ["json", "yaml"] }
tempfile = "3.27"
batchalign-types = { path = "../batchalign-types", version = "0.2.0" }
axum = { version = "0.8", features = ["ws"] }
assert_cmd = "2.2"
predicates = "3.1"
toml = "^1.1.2"
rstest = "0.26.1"
proptest = "1.11.0"

# Deterministic simulation testing (network faults, virtual time)
turmoil = "0.7"
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["client-legacy", "tokio"] }
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }

# This crate finished its panic-site audit on 2026-04-29 (see
# `book/src/operations/panic-audit/batchalign-app.md`, `book/src/operations/panic-audit/batchalign-cli.md`,
# and `book/src/operations/panic-audit/batchalign-chat-ops.md`).
# All non-test panic shapes carry rationale-bearing `#[allow]` annotations;
# the workspace `warn` floor is promoted to `deny` here so new sites need a
# deliberate opt-in. See `chatter-lsp/Cargo.toml` for the same pattern + the
# rationale on why workspace-inheritance is replaced with an inlined table.
[lints.clippy]
unwrap_used   = "deny"
expect_used   = "deny"
panic         = "deny"
unreachable   = "deny"
todo          = "deny"
unimplemented = "deny"
