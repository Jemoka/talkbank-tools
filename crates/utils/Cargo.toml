[package]
name = "talkbank-utils"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
publish = false
description = "Shared testing helpers and workspace-level integration tests for the talkbank toolchain"

[lints]
workspace = true

[dependencies]
clap = { version = "4.6", features = ["derive", "env"] }
crossterm = "0.29"
dirs = "6.0"
indicatif = "0.18"
ratatui = { version = "0.30", features = ["serde"] }
serde = { version = "1.0", features = ["derive", "rc"] }
serde_json = "1.0"
talkbank-model = { path = "../core/talkbank-model", version = "0.2.0" }
talkbank-parser = { path = "../core/talkbank-parser", version = "0.2.0" }
talkbank-transform = { path = "../core/talkbank-transform", version = "0.2.0" }
tempfile = "3.27"
thiserror = "^2.0.18"
tree-sitter = "0.26"
tree-sitter-talkbank = { path = "../../grammar", version = "0.2.0" }

[dev-dependencies]
crossbeam-channel = "0.5"
jsonschema = { version = "0.46", default-features = false, features = ["resolve-file"] }
num_cpus = "1.17"
rayon = "1.12"
schemars = { version = "1.2", features = ["indexmap2", "smol_str03"] }
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite", "migrate"] }
chatter-lsp = { path = "../chatter/chatter-lsp", version = "0.2.0" }
talkbank-parser-tests = { path = "../core/talkbank-parser-tests", version = "0.2.0" }
unicode-width = "0.2"
walkdir = "^2.5"
