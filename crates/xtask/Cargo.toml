[package]
name = "xtask"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
serde = { version = "1.0", features = ["derive", "rc"] }
serde_json = "1.0"
toml = "^1.1.2"
walkdir = "^2.5"
blake3 = "1.8"
chrono = "0.4"
# `audit-docs` writes a SQLite catalog. sqlx (the same crate the
# batchalign server uses) replaces the previous sync rusqlite binding
# so the workspace links a single libsqlite3-sys version. A small
# tokio runtime is started just for the audit-docs subcommand.
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite", "migrate"] }
tokio = { version = "1.52", features = ["full", "rt", "macros"] }
regex = "1.12"

[lints]
workspace = true
