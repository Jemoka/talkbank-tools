[package]
name = "chatter-cli"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true
description = "Command-line interface for CHAT format validation, conversion, and normalization"
readme = "README.md"

[[bin]]
name = "chatter"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
atty = "0.2"
chrono = "0.4"
clap = { version = "4.6", features = ["derive", "env"] }
crossbeam-channel = "0.5"
crossterm = "0.29"
ctrlc = "3.5"
dirs = "6.0"
indicatif = "0.18"
notify = "8.2"
ratatui = { version = "0.30", features = ["serde"] }
send2clan-sys = { path = "../../clan/send2clan-sys", version = "0.2.0" }
serde = { version = "1.0", features = ["derive", "rc"] }
serde_json = "1.0"
toml = "^1.1.2"
clan-core = { path = "../../clan/clan-core", version = "0.2.0" }
talkbank-model = { path = "../../core/talkbank-model", version = "0.2.0" }
talkbank-parser-tests = { path = "../../core/talkbank-parser-tests", version = "0.2.0" }
talkbank-transform = { path = "../../core/talkbank-transform", version = "0.2.0" }
talkbank-parser = { path = "../../core/talkbank-parser", version = "0.2.0" }
thiserror = "^2.0.18" #unified
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
unicode-width = "0.2"
walkdir = "^2.5" #unified

[dev-dependencies]
assert_cmd = "2.2"
predicates = "3.1"
serde_json = "1.0"
tempfile = "3.27"

# Panic-site audit completed 2026-04-29 (see
# `book/src/operations/panic-audit/chatter-cli.md`). 14 non-test sites annotated.
[lints.clippy]
unwrap_used   = "deny"
expect_used   = "deny"
panic         = "deny"
unreachable   = "deny"
todo          = "deny"
unimplemented = "deny"
