[package]
name = "talkbank-spec-testrun"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
publish = false
description = "Runs specs through the live parser/model: validate_error_specs (verify spec-claimed error codes match real parser output) and extract_corpus_candidates (mine real .cha files for candidate specs)"

[lints]
workspace = true

[dependencies]
anyhow = "1.0"
clap = { version = "4.6", features = ["derive", "env"] }
serde = { version = "1.0", features = ["derive", "rc"] }
serde_json = "1.0"
thiserror = "^2.0.18"
walkdir = "^2.5"
tree-sitter = "0.26"
tree-sitter-talkbank = { path = "../../../grammar", version = "0.2.0" }

talkbank-spec-testgen = { path = "../talkbank-spec-testgen", version = "0.2.0" }
talkbank-model = { path = "../../core/talkbank-model", version = "0.2.0" }
talkbank-parser = { path = "../../core/talkbank-parser", version = "0.2.0" }
