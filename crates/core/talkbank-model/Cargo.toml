[package]
name = "talkbank-model"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true
description = "TalkBank data model and validation"
readme = "README.md"

[dependencies]
crossbeam-channel = { version = "0.5", optional = true }
dashmap = "6.1"
indexmap = { version = "2.14", features = ["serde"] }
miette = { version = "7.6.0", features = ["derive"] }
parking_lot = "0.12"
phf = { version = "0.13", features = ["macros"] }
schemars = { version = "1.2", features = ["indexmap2", "smol_str03"] }
serde = { version = "1.0", features = ["derive", "rc"] }
serde_json = "1.0"
smallvec = { version = "1.15", features = ["serde", "union", "const_generics"] }
smol_str = { version = "0.3", features = ["serde"] }
talkbank-derive = { path = "../talkbank-derive", version = "0.2.0" }
text-size = "1.1"
thiserror = "^2.0.18"
tracing = "0.1"
tokio = { version = "1.52", optional = true, features = ["full", "rt", "sync"] }

[dev-dependencies]
insta = { version = "1.47", features = ["json", "yaml"] }
proptest = "1.11.0"
rstest = "0.26.1"
tokio = { version = "1.52", features = ["full", "macros", "rt-multi-thread"] }

[build-dependencies]
phf_codegen = "0.13"

[features]
default = []
async = ["tokio"]
channels = ["dep:crossbeam-channel"]

# Panic-site audit completed 2026-04-29 (see
# `book/src/operations/panic-audit/talkbank-model.md`). 2 non-test src/ sites
# annotated; build.rs panics are exempt by spirit (build-time, not
# runtime).
[lints.clippy]
unwrap_used   = "deny"
expect_used   = "deny"
panic         = "deny"
unreachable   = "deny"
todo          = "deny"
unimplemented = "deny"
