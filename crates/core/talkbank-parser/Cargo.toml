[package]
name = "talkbank-parser"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true
description = "Parsing implementations for CHAT format (tree-sitter and hand-written)"
readme = "README.md"

[dependencies]
indexmap = { version = "2.14", features = ["serde"] }
smallvec = { version = "1.15", features = ["serde", "union", "const_generics"] }
smol_str = { version = "0.3", features = ["serde"] }
talkbank-model = { path = "../talkbank-model", version = "0.2.0" }
thiserror = "^2.0.18" #unified
tracing = "0.1"
tree-sitter = "0.26"
tree-sitter-talkbank = { path = "../../../grammar", version = "0.2.0" }

[dev-dependencies]
talkbank-parser-tests = { path = "../talkbank-parser-tests", version = "0.2.0" }
divan = "0.1"
insta = { version = "1.47", features = ["json", "yaml"] }
proptest = "1.11.0"
rstest = "0.26.1"

[[bench]]
name = "parse"
harness = false

# Panic-site audit completed 2026-04-29 — zero non-test sites in
# this crate (see `book/src/operations/panic-audit/talkbank-parser.md`). `deny`
# prevents new sites without a deliberate `#[allow]` opt-in.
[lints.clippy]
unwrap_used   = "deny"
expect_used   = "deny"
panic         = "deny"
unreachable   = "deny"
todo          = "deny"
unimplemented = "deny"
