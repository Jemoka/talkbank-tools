[package]
name = "talkbank-cache"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true
description = "SQLite-backed validation/roundtrip cache for talkbank-tools (chatter validation)"
readme = "README.md"

[dependencies]
# `sqlite-unbundled`: link against the system sqlite via libsqlite3-sys's
# `SQLITE3_LIB_DIR` / `SQLITE3_INCLUDE_DIR` env-var path, not the bundled
# sqlite3.c compile. The bundled path fails outside Bazel on macOS 26.x
# (see book/src/contributing/macos-sdk.md / CONTRIBUTING.md). Chatter is
# the only consumer of this crate today; chatter contributors run with
# `brew install sqlite` / `apt install libsqlite3-dev`.
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite-unbundled", "migrate"] }
tokio = { version = "1.52", features = ["full"] }
dirs = "6.0"
blake3 = "1.8"
thiserror = "^2.0.18"
tracing = "0.1"
talkbank-transform = { path = "../talkbank-transform", version = "0.2.0" }

[dev-dependencies]
tempfile = "3.27"

[lints.clippy]
unwrap_used   = "deny"
expect_used   = "deny"
panic         = "deny"
unreachable   = "deny"
todo          = "deny"
unimplemented = "deny"
