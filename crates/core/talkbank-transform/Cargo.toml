[package]
name = "talkbank-transform"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true
description = "Transformation pipelines for CHAT format (CHAT ↔ JSON, normalization)"
readme = "README.md"

[dependencies]
aho-corasick = "1.1"
blake3 = "1.8"
crossbeam-channel = "0.5"
csv = "1"
dirs = "6.0"
jsonschema = { version = "0.46", default-features = false, features = ["resolve-file"] }
miette = { version = "7.6.0", features = ["derive", "fancy"] }
num_cpus = "1.17"
quick-xml = "0.39"
schemars = { version = "1.2", features = ["indexmap2", "smol_str03"] }
serde = { version = "1.0", features = ["derive", "rc"] }
serde_json = "1.0"
smallvec = { version = "1.15", features = ["serde", "union", "const_generics"] }
smol_str = { version = "0.3", features = ["serde"] }
strsim = "0.11.1"
talkbank-model = { path = "../talkbank-model", version = "0.2.0" }
talkbank-parser = { path = "../talkbank-parser", version = "0.2.0" }
talkbank-parser-re2c = { path = "../talkbank-parser-re2c", version = "0.2.0" }
thiserror = "^2.0.18" #unified
tokio = { version = "1.52", features = ["full"] }
tracing = "0.1"
whatlang = "0.18"
ferrous-opencc = "0.4.0"

[dev-dependencies]
talkbank-cache = { path = "../talkbank-cache", version = "0.2.0" }
proptest = "1.11.0"
tempfile = "3.27"
insta = { version = "1.47", features = ["json", "yaml"] }

# Panic-site audit completed 2026-04-29 (see
# `book/src/operations/panic-audit/talkbank-transform.md`).
[lints.clippy]
unwrap_used   = "deny"
expect_used   = "deny"
panic         = "deny"
unreachable   = "deny"
todo          = "deny"
unimplemented = "deny"
