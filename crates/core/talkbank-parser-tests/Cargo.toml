[package]
name = "talkbank-parser-tests"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Shared parser test harness and fixtures"
publish = false

[dependencies]
clap = { version = "4.6", features = ["derive", "env"] }
comrak = "0.52.0"
insta = { version = "1.47", features = ["json", "yaml"] }
regex = "1.12" #unified
serde = { version = "1.0", features = ["derive", "rc"] }
serde_json = "1.0"
shellexpand = "3.1"
talkbank-model = { path = "../talkbank-model", version = "0.2.0" }
talkbank-parser = { path = "../talkbank-parser", version = "0.2.0" }
thiserror = "^2.0.18"
toml = "^1.1.2" #unified
tree-sitter = "0.26"
tree-sitter-talkbank = { path = "../../../grammar", version = "0.2.0" }
walkdir = "^2.5" #unified

[dev-dependencies]
insta = { version = "1.47", features = ["json", "yaml"] }
proptest = "1.11.0"
quick-xml = "0.39"
rstest = "0.26.1"
talkbank-transform = { path = "../talkbank-transform", version = "0.2.0" }

[lints]
workspace = true
