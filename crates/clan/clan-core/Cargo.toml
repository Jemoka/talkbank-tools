[package]
name = "clan-core"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true
description = "CLAN analysis command reimplementation for CHAT transcripts"
readme = "README.md"

[dependencies]
indexmap = { version = "2.14", features = ["serde"] }
quick-xml = "0.39"
rand = "0.10"
schemars = { version = "1.2", features = ["indexmap2", "smol_str03"] }
serde = { version = "1.0", features = ["derive", "rc"] }
serde_json = "1.0"
smallvec = { version = "1.15", features = ["serde", "union", "const_generics"] }
thiserror = "^2.0.18"
tracing = "0.1"
walkdir = "^2.5"

# TalkBank crates
talkbank-model = { path = "../../core/talkbank-model", version = "0.2.0" }
talkbank-transform = { path = "../../core/talkbank-transform", version = "0.2.0" }

[dev-dependencies]
insta = { version = "1.47", features = ["json", "yaml"] }
smallvec = { version = "1.15", features = ["serde", "union", "const_generics"] }
tempfile = "3.27"

# Panic-site audit completed 2026-04-29 (see
# `book/src/operations/panic-audit/clan-core.md`). Most sites are
# `writeln!(...).unwrap()` to `String` (infallible) — annotated at
# the file level on each emitter / converter source.
[lints.clippy]
unwrap_used   = "deny"
expect_used   = "deny"
panic         = "deny"
unreachable   = "deny"
todo          = "deny"
unimplemented = "deny"
