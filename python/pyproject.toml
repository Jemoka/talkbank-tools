[build-system]
# Exact pin (==) rather than a range so the build is reproducible. Bump in
# lockstep with `[tool.batchalign.pinned_tools].maturin` below; the
# hermeticity guard asserts the runtime version matches.
requires = ["maturin==1.7.4"]
build-backend = "maturin"

[project]
name = "batchalign"
version = "0.9.0-alpha.3"
description = "TalkBank CHAT processing pipeline"
readme = "batchalign/README.md"
license = "BSD-3-Clause"
# Stable ABI (abi3) means a single cp310-abi3-<platform> wheel installs
# on any CPython >= 3.10. The build interpreter still pins to 3.12
# (see [tool.batchalign.pinned_tools].python + MODULE.bazel), but end
# users on 3.10, 3.11, 3.12, 3.13+ can all `pip install batchalign`.
requires-python = ">=3.10"
authors = [
    { name = "Brian MacWhinney", email = "macw@cmu.edu" },
    { name = "Houjun Liu", email = "houjun@stanford.edu" },
    { name = "Franklin Chen", email = "franklinchen@franklinchen.com" },
]
keywords = ["nlp", "linguistics", "chat", "talkbank", "transcription", "forced-alignment", "morphosyntax"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: BSD License",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Operating System :: Microsoft :: Windows",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Text Processing :: Linguistic",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Rust",
]
dependencies = [
    "typer>=0.12",
    # `batchalign.cli` subclasses `TyperGroup` and references `click.Context`,
    # `click.Command`, and `click.HelpFormatter` directly. Typer pulls click
    # in transitively, but the wheel smoke test on a clean Python 3.10 venv
    # has been observed to import-error on click before typer's transitive
    # resolution lands — list it as a direct dep so it is guaranteed present.
    "click>=8",
    "tqdm>=4",
    "numpy>=1.24",
    "polars>=0.20",
    "soundfile>=0.12",
    # CLI presentation layer (cli/tui/). Used for the per-file progress
    # bars + completion log + summary block, and for the RichHandler that
    # formats the records library logging emits at -v / -vv. Hard runtime
    # dep — every `batchalign3 ...` invocation exercises it.
    "rich>=13",
    # Runtime requirement of `batchalign._core._proto_generated`, the
    # autogenerated pydantic-v2 wire types produced from the Rust schemars
    # output. Always present in the wheel; the generated module imports
    # `pydantic.BaseModel` / `pydantic.Base64Bytes` / `pydantic.Field`.
    "pydantic>=2",
    # `batchalign.lang.LanguageCode` imports `pycountry` unconditionally
    # at module import; the wheel smoke test on a clean Python 3.10 env
    # otherwise ImportErrors before any user code runs.
    "pycountry",
]

# Optional dependency groups. A user pulling in heavy ML stacks opts in
# explicitly via `batchalign[whisper]`, `batchalign[stanza]`, etc.
# `batchalign[all]` is the kitchen sink for users who don't care.
[project.optional-dependencies]
# `nltk` powers the CHATUtterance BERT segmenter's sentence split (BA2 parity).
whisper      = ["transformers>=4.57,<5", "torch>=2.0", "torchaudio>=2.0", "nltk>=3.8", "openai-whisper", "pycountry", "num2words"]
stanza       = ["stanza>=1.12", "transformers>=4.57,<5"]
pyannote     = ["pyannote.audio>=3.0", "onnxruntime>=1.16"]
revai        = ["rev-ai"]
cantonese    = ["pycantonese>=4.2,<5", "tencentcloud-sdk-python-asr", "tencentcloud-sdk-python-tmt", "aliyun-python-sdk-core>=2.13", "aliyun-python-sdk-alimt", "funasr==1.3.1", "opencc", "cos-python-sdk-v5"]
translate    = ["googletrans"]
qwen3        = ["qwen-asr", "transformers>=4.57,<5", "torch>=2.0"]
nllb         = ["transformers>=4.57,<5", "torch>=2.0", "sentencepiece"]
# HTTP daemon (`batchalign3 daemon`, the PyApp-bundled sidecar). The
# desktop GUI's Tauri shell spawns this binary as a sidecar. `[standard]`
# pulls uvloop + httptools for higher throughput than the pure-Python
# asyncio loop, `sse-starlette` powers `/jobs/{id}/events` per-job
# Server-Sent Events.
api          = ["fastapi>=0.110", "uvicorn[standard]>=0.27", "sse-starlette>=2.0", "python-multipart>=0.0.9"]
all = [
    "transformers>=4.57,<5", "torch>=2.0", "torchaudio>=2.0", "nltk>=3.8",
    "openai-whisper", "pycountry", "num2words",
    "stanza>=1.12",
    "pyannote.audio>=3.0", "onnxruntime>=1.16",
    "rev-ai",
    "pycantonese>=4.2,<5", "tencentcloud-sdk-python-asr", "tencentcloud-sdk-python-tmt", "aliyun-python-sdk-core>=2.13", "aliyun-python-sdk-alimt", "funasr==1.3.1", "opencc", "cos-python-sdk-v5",
    "googletrans",
    "qwen-asr",
    "sentencepiece",
    "fastapi>=0.110", "uvicorn[standard]>=0.27", "sse-starlette>=2.0", "python-multipart>=0.0.9",
]
dev = [
    "maturin==1.7.4",  # mirror [build-system].requires + pinned_tools
    "pytest>=7",
    "pytest-xdist",
    "mypy",
    # Proto codegen toolchain. Pulled in via the Bazel
    # `//python/batchalign/_core:_proto_generated` genrule. Never invoked
    # by hand — Bazel rebuilds `_proto_generated.py` whenever the Rust
    # schema emitter output changes.
    "datamodel-code-generator>=0.26",
    # PEP 517 build frontends. aspect_rules_py's uv extension needs
    # versions for any build backend in the resolution graph; pulling
    # them in via dev ensures they land in uv.lock.
    "build",
    "wheel",
    "setuptools",
    "hatchling",
    "poetry-core",
]

[project.scripts]
batchalign = "batchalign.cli:app"

[project.urls]
Homepage = "https://github.com/TalkBank/talkbank-tools"
Repository = "https://github.com/TalkBank/talkbank-tools"
Issues = "https://github.com/TalkBank/talkbank-tools/issues"

# Maturin builds the engine crate's cdylib and drops the resulting .so
# at `python/batchalign/_core/_core.<abi>.so`. Python imports the symbols
# via `from batchalign._core import ...`.
[tool.maturin]
manifest-path = "../crates/batchalign/batchalign-engine/Cargo.toml"
python-source = "."
# `module-name = "batchalign._core._core"` nests the cdylib INSIDE the
# existing `batchalign/_core/` Python package. Without the extra
# `._core` segment, maturin places the .so at `batchalign/_core.<abi>.so`
# — shadowed at import time by the `batchalign/_core/` directory
# (Python prefers packages over modules at the same path), and
# `batchalign/_core/__init__.py`'s `from batchalign._core._core import *`
# fails with `No module named 'batchalign._core._core'`.
module-name   = "batchalign._core._core"
# Both features are required:
#   `pyo3/extension-module`         — tells pyo3 not to link libpython
#   `batchalign-engine/extension-module` — gates the engine's own
#                                          `#[pymodule] fn _core(...)`
#                                          (see engine/src/lib.rs). Without
#                                          it the cdylib has no
#                                          `PyInit__core` symbol and the
#                                          wheel import errors with
#                                          "dynamic module does not define
#                                          module export function".
features      = ["pyo3/extension-module", "extension-module"]
profile       = "dev"

# ---------------------------------------------------------------------------
# Hermeticity pins.
#
# Since the Python wheel build path escapes Bazel (maturin shells out to the
# host cargo and to the host CPython), we guard the escape ourselves: the
# `bazel/python/hermeticity_guard.sh` script asserts that the live versions
# of these tools match the pins below before any maturin/uv/pytest invocation.
#
# Bumping a pin:
#   1. Update the value here.
#   2. For uv:     also update `MODULE.bazel` -> `uv.toolchain(uv_version = ...)`.
#   3. For python: also update `MODULE.bazel` -> `python.toolchain(python_version = ...)`
#                  and `.bazelrc` -> `--@rules_python//python/config_settings:python_version=...`.
#   4. For maturin: also update `[build-system].requires` above (PEP 517 build
#                   pin) and the dev-deps section if listed.
# ---------------------------------------------------------------------------
[tool.batchalign.pinned_tools]
python = "3.12"      # major.minor; patch float is intentional (cibuildwheel
                     # picks the CI runner's patch level for each matrix cell)
uv = "0.5.18"        # mirror MODULE.bazel uv.toolchain
maturin = "1.7.4"    # used for `maturin develop` and `maturin build` —
                     # bump in lockstep with [build-system].requires
rust = "1.95.0"      # mirror MODULE.bazel rust.toolchain(versions = [...])
pyapp = "0.27.0"     # https://crates.io/crates/pyapp -- consumed by
                     # `bazel/python/pyapp_build.sh` to produce
                     # `//python/batchalign:sidecar`. Bump in lockstep
                     # with any PYAPP_* env-var contract changes in
                     # pyapp_build.sh (the env-var schema evolves
                     # between minor releases).

[dependency-groups]
# PEP 735 dependency groups. aspect_rules_py's `uv.project` extension
# reads these (not `[project] dependencies` directly) to populate
# `@pypi//*` Bazel deps. Adding a runtime/dev/etc. dep here makes it
# reachable as `@pypi//<name>` after the next `cd python && uv lock`.
#
# `runtime` mirrors `[project] dependencies` + the lazily-imported
# optional groups that batchalign actually wires for the Bazel-run path
# (stanza + its transformers tagger). Other extras (whisper / pyannote
# / vllm / rev-ai / translate / cantonese) only
# matter to wheel consumers; they live in `[project.optional-dependencies]`
# above and reach the wheel via maturin's pyproject.toml reader.
runtime = [
    "click>=8",
    "numpy>=1.24",
    "polars>=0.20",
    "pydantic>=2",
    "rich>=13",
    "soundfile>=0.12",
    "stanza>=1.12",
    "tqdm>=4",
    "transformers>=4.57,<5",
    "typer>=0.12",
    # `openai-whisper` provides the `whisper` package for the openai ASR engine
    # (BA2's `whisper_oai`). `pycountry` mirrors BA2's language-name resolution.
    "openai-whisper",
    "pycountry",
]
dev = [
    "pytest>=9.0.3",
    "pytest-xdist",
    "mypy",
    "twine>=5",
    # Proto codegen toolchain (see [project.optional-dependencies].dev for
    # rationale). Bazel-only invocation; no hand step.
    "datamodel-code-generator>=0.26",
    # PEP 517 build frontends — aspect_rules_py needs versions for
    # build backends in the resolution graph.
    "build",
    "wheel",
    "setuptools",
    "hatchling",
    "poetry-core",
    # API surface (FastAPI + SSE) — needed so the openapi_freshness
    # Bazel test can boot `batchalign.api` and snapshot `app.openapi()`.
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "sse-starlette>=2.0",
    "python-multipart>=0.0.9",
]
